name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: inventhq/state-machine

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Apply K8s manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Ensure GHCR pull secret
        run: |
          kubectl delete secret ghcr-pull-secret -n state-machine --ignore-not-found
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace state-machine \
            --docker-server=ghcr.io \
            --docker-username=vishvadlamani \
            --docker-password=${{ secrets.GHCR_TOKEN }}

      - name: Update image to new SHA
        run: |
          kubectl set image deployment/state-machine \
            state-machine=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n state-machine

      - name: Restart pods to pick up new pull secret
        run: |
          kubectl rollout restart deployment/state-machine -n state-machine

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/state-machine -n state-machine --timeout=180s
