name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/inventhq/state-machine:latest
            ghcr.io/inventhq/state-machine:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.CIVO_KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Create/update GHCR pull secret
        run: |
          kubectl -n state-machine delete secret ghcr-pull-secret --ignore-not-found
          kubectl -n state-machine create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PAT }}

      - name: Create/update app secrets
        run: |
          kubectl -n state-machine delete secret state-machine-secrets --ignore-not-found
          kubectl -n state-machine create secret generic state-machine-secrets \
            --from-literal=TURSO_DATABASE_URL="${{ secrets.TURSO_DATABASE_URL }}" \
            --from-literal=TURSO_AUTH_TOKEN="${{ secrets.TURSO_AUTH_TOKEN }}" \
            --from-literal=API_KEY="${{ secrets.API_KEY }}" \
            --from-literal=EVENT_CORE_INGEST_URL="${{ secrets.EVENT_CORE_INGEST_URL }}" \
            --from-literal=PLATFORM_API_URL="${{ secrets.PLATFORM_API_URL }}" \
            --from-literal=PLATFORM_API_KEY="${{ secrets.PLATFORM_API_KEY }}"

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Wait for rollout
        run: kubectl -n state-machine rollout status deployment/state-machine --timeout=300s
